name: build

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # MLX / Metal and CoreAudio require a native Apple Silicon runner.
    runs-on: macos-15
    # A cold build (no cache) compiles MLX three times: workspace, release smoke, package check.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check native build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --find metal
          cmake --version
      - name: Install Rust toolchains
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies even when a later step fails or times out.
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Verify instructions and skills
        run: make check-agent-sync
      - name: Build all targets
        run: make build
      - name: Unit, integration, and documentation tests
        # Model weights are not downloaded in public CI. See README for golden verification.
        run: make test
      - name: Formatting and strict Clippy
        run: make lint
      - name: Dependency and license audit
        run: make audit
      - name: Build API documentation
        run: make doc
      - name: CLI smoke checks
        run: make smoke
      - name: Check tag matches every package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make check-release-tag
      - name: Verify and collect source packages
        run: make release-artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: source-packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: source-packages
          path: dist
      - uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
