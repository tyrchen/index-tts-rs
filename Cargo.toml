[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
documentation = "https://github.com/tyrchen/index-tts-rs#development"
repository = "https://github.com/tyrchen/index-tts-rs"
homepage = "https://github.com/tyrchen/index-tts-rs"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
approx = "0.5"
arc-swap = "1.9.3"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
cpal = "0.18.2"
criterion = "0.8.2"
dashmap = "6.2"
flume = "0.12.0"
futures-util = "0.3.34"
hf-hub = "1.0.0"
hound = "3.5.1"
memmap2 = "0.9"
mlx-rs = { version = "0.33.0", features = ["metal", "safetensors"] }
proptest = "1.12"
realfft = "3.5.1"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
rstest = "0.26"
rustfft = "6.4.1"
safetensors = "0.8.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
secrecy = "0.10.3"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "mp3", "flac", "pcm", "isomp4", "opt-simd"] }
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "fs", "sync", "time", "net", "io-util", "io-std", "signal", "process"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
typed-builder = "0.23.2"
validator = { version = "0.21.0", features = ["derive"] }
winnow = "1.0.4"

# workspace crates
index-tts-rs-core = { version = "=0.2.0", path = "crates/core" }
index-tts-rs-director = { version = "=0.2.0", path = "crates/director" }
index-tts-rs-service = { version = "=0.2.0", path = "crates/service" }
