[package]
name = "index-tts-rs-cli"
description = "AI-Agent friendly CLI, Unix Domain Socket daemon, and MCP server for IndexTTS-2.5 on Apple Silicon"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "itts"
path = "src/main.rs"

[features]
default = ["asr"]
# `itts listen` / `itts verify`, their daemon requests and MCP tools: local speech recognition with
# sherpa-onnx (ONNX Runtime, linked statically).
asr = ["dep:index-tts-rs-asr", "index-tts-rs-service/asr"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
clap.workspace = true
cpal.workspace = true
flume.workspace = true
hf-hub.workspace = true
index-tts-rs-asr = { workspace = true, optional = true, features = ["recognizer"] }
index-tts-rs-core.workspace = true
index-tts-rs-director.workspace = true
index-tts-rs-service.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
